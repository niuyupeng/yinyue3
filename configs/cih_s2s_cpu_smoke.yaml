seed: 1234
device: cpu
run:
  name: cih_s2s_cpu_smoke
  output_dir: runs/cih_s2s_cpu_smoke
experiment:
  label: cih_s2s_transformer_cpu_smoke
data:
  processed_path: data/processed/cih_s2s_cpu_smoke.npz
  external_xml_dir:
  max_chorales: 20
  harmonic_labels: true
  grid_quarter_length: 0.25
  seq_len: 128
  max_seq_len: 128
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  min_midi: 36
  max_midi: 84
task:
  name: soprano_to_satb
  mask_prob: 0.45
model:
  type: cih_s2s_transformer
  hidden_size: 128
  encoder_layers: 2
  decoder_layers: 2
  heads: 4
  dropout: 0.1
  max_seq_len: 128
  max_measure: 64
  max_relative_distance: 32
  use_harmonic_plan_encoder: true
  use_voice_relation_attention: true
  use_bar_summary_attention: true
  use_bass_skeleton_head: true
  use_hierarchical_stage_fusion: true
  voice_relation_heads: 2
  use_gradient_checkpointing: false
train:
  epochs: 1
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  gradient_accumulation: 1
  grad_accum: 1
  mixed_precision: true
  early_stopping: true
  early_stopping_patience: 3
  num_workers: 0
  fast_dev_batches: 2
eval:
  batch_size: 2
  max_batches: 2
  export_samples: 1
constraints:
  use_rule_guided_decoding: false
constraint_decoder:
  enabled: true
  backend: beam
  beam_size: 2
  top_k: 4
  max_row_candidates: 8
  lambda_rule: 1.0
  hard_constraints:
    - voice_range
    - voice_crossing
    - adjacent_spacing
    - parallel_fifths
    - parallel_octaves
    - unresolved_chordal_seventh
    - leading_tone_resolution
    - final_cadence_legality
  soft_constraint_weights:
    melodic_smoothness: 0.6
    common_tone_retention: 0.25
    contrary_motion_preference: 0.2
    cadence_strength: 0.5
    stylistic_similarity_proxy: 0.2
    singability_proxy: 0.35
decoding:
  iterative_refinement: true
  refinement_steps: 1
  refinement_strategy: confidence
  remask_fraction: 0.35
hardware:
  target_gpu: CPU smoke
  profile: cpu_smoke
  windows_safe_num_workers: 0
  log_gpu_memory: true
  oom_fallback:
    enabled: false
preference_learning:
  enabled: false
  status: dpo_ready_interface_only
  required_evidence: completed_blind_pairwise_preferences
