seed: 2026
run:
  name: cih_s2s_4060ti
  output_dir: runs/cih_s2s_4060ti
experiment:
  label: cih_s2s_transformer_4060ti
data:
  processed_path: data/processed/chorale_main.npz
  external_xml_dir:
  max_chorales:
  harmonic_labels: true
  grid_quarter_length: 0.25
  max_seq_len: 256
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  min_midi: 36
  max_midi: 84
task:
  name: soprano_to_satb
  mask_prob: 0.45
model:
  type: cih_s2s_transformer
  hidden_size: 384
  local_layers: 2
  plan_layers: 2
  decoder_layers: 4
  heads: 6
  dropout: 0.1
  max_seq_len: 256
  max_measure: 256
  max_relative_distance: 64
  use_harmonic_plan_encoder: true
  use_voice_relation_attention: true
  use_bar_summary_attention: true
  use_bass_skeleton_head: true
  use_hierarchical_stage_fusion: true
  voice_relation_heads: 2
  use_gradient_checkpointing: true
train:
  epochs: 80
  batch_size: 4
  learning_rate: 0.00025
  weight_decay: 0.01
  gradient_clip: 1.0
  gradient_accumulation: 2
  mixed_precision: true
  early_stopping_patience: 12
  num_workers: 0
  fast_dev_batches:
eval:
  batch_size: 4
  max_batches:
  export_samples: 10
constraints:
  use_rule_guided_decoding: false
constraint_decoder:
  enabled: true
  backend: beam
  beam_size: 8
  top_k: 12
  max_row_candidates: 96
  lambda_rule: 1.0
  hard_constraints:
    - voice_range
    - voice_crossing
    - adjacent_spacing
    - parallel_fifths
    - parallel_octaves
    - unresolved_chordal_seventh
    - leading_tone_resolution
    - final_cadence_legality
  soft_constraint_weights:
    melodic_smoothness: 0.6
    common_tone_retention: 0.25
    contrary_motion_preference: 0.2
    cadence_strength: 0.5
    stylistic_similarity_proxy: 0.2
    singability_proxy: 0.35
decoding:
  iterative_refinement: true
  refinement_steps: 4
  refinement_strategy: confidence
  remask_fraction: 0.35
preference_learning:
  enabled: false
  status: dpo_ready_interface_only
  required_evidence: completed_blind_pairwise_preferences

