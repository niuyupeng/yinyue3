seed: 2026

experiment:
  label: external_musicxml_satb_intake_template

data:
  # Replace with a local folder that has passed:
  # .\scripts\audit_project1_external_musicxml_corpus.ps1 -Folder <path>
  external_xml_dir: data/external_musicxml/SELECTED_SATB_SUBSET
  processed_path: data/processed/chorale_external_musicxml_template.npz
  max_chorales: null
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  grid_quarter_length: 0.25
  min_midi: 36
  max_midi: 84
  max_seq_len: 256

task:
  name: soprano_to_satb
  mask_prob: 0.45

model:
  type: transformer
  hidden_size: 128
  heads: 4
  layers: 2
  dropout: 0.1
  max_seq_len: 256

train:
  batch_size: 8
  epochs: 20
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip: 1.0
  mixed_precision: true
  early_stopping_patience: 6
  num_workers: 0

run:
  name: external_musicxml_satb_intake_template
  output_dir: runs/external_musicxml_satb_intake_template

eval:
  batch_size: 8
  export_samples: 8

constraints:
  use_rule_guided_decoding: true
  use_constraint_reranking: true
  rerank_top_k: 4
  rerank_rule_weight: 1.0
  rerank_harmony_weight: 0.25
  rerank_temporal_weight: 1.0
  rerank_seventh_weight: 1.0

decoding:
  iterative_refinement: true
  refinement_steps: 2
  refinement_strategy: confidence
  remask_fraction: 0.35
