seed: 2026
run:
  name: chorale_no_constraints
  output_dir: runs/chorale_no_constraints
data:
  processed_path: data/processed/chorale_main.npz
  external_xml_dir:
  max_chorales:
  harmonic_labels: true
  grid_quarter_length: 0.25
  max_seq_len: 256
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  min_midi: 36
  max_midi: 84
task:
  name: soprano_to_satb
  mask_prob: 0.45
model:
  type: transformer
  hidden_size: 384
  layers: 6
  heads: 6
  dropout: 0.1
  max_seq_len: 256
train:
  epochs: 50
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  mixed_precision: true
  early_stopping_patience: 10
  num_workers: 0
  fast_dev_batches:
eval:
  batch_size: 8
  max_batches:
  export_samples: 10
constraints:
  use_rule_guided_decoding: false
