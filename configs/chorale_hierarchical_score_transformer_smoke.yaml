seed: 1234
run:
  name: chorale_hierarchical_score_transformer_smoke
  output_dir: runs/chorale_hierarchical_score_transformer_smoke
experiment:
  label: hierarchical_score_transformer_smoke
data:
  processed_path: data/processed/chorale_smoke.npz
  external_xml_dir:
  max_chorales: 20
  harmonic_labels: true
  grid_quarter_length: 0.25
  max_seq_len: 128
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  min_midi: 36
  max_midi: 84
task:
  name: soprano_to_satb
  mask_prob: 0.45
model:
  type: hierarchical_score_transformer
  hidden_size: 96
  local_layers: 1
  plan_layers: 1
  decoder_layers: 1
  heads: 4
  dropout: 0.1
  max_seq_len: 128
  max_measure: 64
  max_relative_distance: 32
  use_harmony_plan: true
  use_voice_relation_attention: true
  voice_relation_heads: 2
  use_gradient_checkpointing: false
train:
  epochs: 1
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  gradient_accumulation: 1
  mixed_precision: true
  early_stopping_patience: 3
  num_workers: 0
  fast_dev_batches: 2
eval:
  batch_size: 2
  max_batches: 2
  export_samples: 1
constraints:
  use_rule_guided_decoding: true
  use_constrained_beam_search: true
  decoder: constrained_beam
  beam_size: 2
  beam_top_k: 2
  max_row_candidates: 8
  beam_rule_weight: 0.8
  beam_harmony_weight: 0.2
  beam_temporal_weight: 1.5
  beam_seventh_weight: 1.0
decoding:
  iterative_refinement: true
  refinement_steps: 2
  refinement_strategy: confidence
  remask_fraction: 0.35
